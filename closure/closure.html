    <!-- "Lexical Scope is a stationary, structural blueprint created at compile-time. It dictates the variable access rules, 
     stating that an inner child function always has lookup access to its parent function's variables based on 
     its physical location in the code file.
      It has nothing to do with active execution.

A Closure, on the other hand, is the runtime manifestation of that blueprint.
 It occurs when we actually execute that inner function completely outside of its original parent context, 
 yet it actively retains a hidden memory backpack containing those parent variables,
  preventing the engine's garbage collector from destroying them." -->
